name: Validate SDKs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:quality
      - run: pnpm check:artifacts
      - run: pnpm pack --out distilled.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: distilled-package
          path: distilled.tgz
